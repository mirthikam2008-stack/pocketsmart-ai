name: PocketSmart AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Static Security Analysis (Bandit)
        run: |
          bandit -r services/ -s B101,B104

      - name: Audit Dependencies for Known Vulnerabilities
        run: |
          pip-audit -r requirements.txt --ignore-vuln CVE-NONE || true

  test-suite:
    name: 8-Stage Regression & Mock Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-security
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Locked Production Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated 8-Stage Regression Suite (Mock Mode)
        run: |
          python test_pipeline.py --mode mock

  container-build-verification:
    name: Container Build & Health Check Test
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t pocketsmart-ai:test .

      - name: Container Spin-up & Health Check Verification
        run: |
          docker run -d --name test_app -p 8080:8080 -e PORT=8080 pocketsmart-ai:test
          sleep 10
          curl --fail http://localhost:8080/_stcore/health || exit 1
          docker stop test_app
